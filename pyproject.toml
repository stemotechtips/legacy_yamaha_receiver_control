[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-yamaha-receiver-control"
version = "0.1.3"
description = "Control compatible late-2000s Yamaha receivers over their Web Control Interface"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENCE.md"}
authors = [
    {name = "stemotechtips"},
]
dependencies = [
    "aiohttp>=3.14.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.scripts]
yamaha-receiver = "legacy_yamaha_receiver.yamaha_receiver:cli"

[tool.setuptools.packages.find]
include = ["legacy_yamaha_receiver*"]